<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Oli Beta</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Karten-Knöpfe -->
<div id="fabsRight" class="fabs-right">
  <button id="btnCompass" class="fab fab-compass" aria-label="Norden oben"></button>
  <button id="btnVoice" class="fab fab-voice" aria-label="Ansagen"></button>
  <div class="fab-wrap"><span id="satLabel" class="fab-label">Satellit aus</span><button id="btnLayer" class="fab" aria-label="Satellit"></button></div>
  <button id="btnLocate" class="fab" aria-label="Mein Standort"></button>
</div>

<!-- Startseite: Routen-Karte und Reiter -->
<div id="homeCard" class="home-card glass"></div>
<nav id="tabs" class="tabs glass"></nav>

<!-- Stopp-Liste -->
<section id="sheet" class="sheet">
  <div class="sheet-handle" id="sheetHandle"><i></i></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<footer id="footer" class="footer"></footer>

<!-- Seitenmenü -->
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer"></aside>

<!-- Navigation -->
<div id="navTop" class="nav-top"></div>
<div id="navBottom" class="nav-bottom panel"></div>

<!-- Seiten / Dialoge -->
<div id="pages"></div>
<div id="toast" class="toast"></div>

<script src="maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
